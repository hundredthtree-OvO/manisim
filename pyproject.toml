[project]
name = "mani-sim"
version = "0.1.0"
description = "Mouse-driven ManiSkill 3 manipulation research scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mani-skill>=3.0.1",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
]

[project.scripts]
mani-sim = "mani_sim.app:main"
mani-sim-calibrate = "mani_sim.calibration:main"
mani-sim-report = "mani_sim.recording.session_report:main"
mani-sim-branch-collect = "mani_sim.experiments.run_pre_lift:main"
mani-sim-effect-dataset = "mani_sim.experiments.effect_dataset:main"
mani-sim-effect-baseline = "mani_sim.experiments.effect_baseline:main"
mani-sim-effect-baseline-summary = "mani_sim.experiments.effect_baseline_summary:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = [
    "-p", "no:launch_testing",
    "-p", "no:launch_ros",
    "-p", "no:ament_copyright",
    "-p", "no:ament_flake8",
    "-p", "no:ament_xmllint",
    "-p", "no:ament_pep257",
    "-p", "no:ament_lint",
]
testpaths = ["tests"]
markers = [
    "gpu: requires an NVIDIA/Vulkan device and executes physical simulation",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
